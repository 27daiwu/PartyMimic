# PartyMimic P5.2 test modes - the ONLY place that defines them (read by start.sh, the service and selfcheck). Every mode is INDEPENDENT: choose any, in any order.
# line:  mode_<name>  <ref_mode: paused|running|check>  <run_s>  <evidence 0|1>  <voice phrase (<= 6 chars)>  <description...>
#   ref_mode  paused  = the FIRST FRAME OF THE DANCE (dance frame 0, the pose the dance starts from) is frozen for the whole window (hold test);  running = the dance is played (the first run_s seconds);  check = read-only F1+F3 check, never armed
#   evidence  1 = field evidence exists (hold: 3/3 on the real robot) - menu hint only, NEVER a start condition. V1.6.1: no authorisation / confirmation exists for ANY mode: ./start.sh arms every mode except check.
#   time axis: every running mode is played as  1 s frozen lead-in (the dance's first frame, lead_in_s) + the dance seconds below + 0.5 s last-frame hold.  run_s counts DANCE seconds only.
# The PASS/FAIL history (logs/mode_pass.jsonl) is shown in the menu and kept as a record. It never blocks a start. Suggested order for the field test: check, hold, exit, clip2, clip4, dance.
mode_check  check    3.0  0  仅检查    只读 F1+F3 准入检查：不需要运动授权，永不武装，绝不下发电机指令
mode_hold   paused   3.0  1  保持测试  接管后保持舞蹈第 0 帧（动作首帧）3 秒，再交还 WalkRun（真机 3/3 PASS）
mode_exit   paused   8.0  0  退出测试  保持舞蹈第 0 帧最长 8 秒；运动中双击 START 验证主动退出 -> WalkRun 恢复
mode_clip2  running  2.0  0  舞蹈二秒  播放舞蹈前 2 秒，冻结 0.5 秒后交还
mode_clip4  running  4.0  0  舞蹈四秒  播放舞蹈前 4 秒，冻结 0.5 秒后交还
mode_dance  running  7.1  0  完整舞蹈  整段舞蹈（时长以 motion.bin 为准）+ 1 秒前导冻结 + 0.5 秒末帧保持后交还
