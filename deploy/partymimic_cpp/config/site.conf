# PartyMimic site configuration. Format: "key value [value ...]", '#' starts a comment. Read by the service and by every F1+F3 run.

# FSM ids a take-over may start from (official walking family). Verified against wbc_nx (main.cpp / replay.cpp): 801 and 802 are the two official
# walking modes it manages (kWalkingMode / kWalkingMode1), 505 is its teleop mode, 500 is the SDK Start() id. The robot in the field log reads 802
# while standing under the factory WalkRun. 0 (ZeroTorque) and 1 (Damp/PASSIVE) are ALWAYS refused (hard-coded). Any other id is refused with a hint:
# put the robot into the official WalkRun with the factory remote first (this program never switches the FSM by itself before a take-over).
entry_fsm_allowed 500 505 801 802

# Optional rt/lowcmd baseline. Counting writers does not decide conflicts (factory services keep idle writers on rt/arm_sdk and rt/user_lowcmd;
# the factory motion service writes rt/lowcmd): an ACTIVE writer on rt/user_lowcmd or rt/arm_sdk always blocks. If you set a baseline
# (oem_lowcmd_confirmed 1 + oem_lowcmd_expected_writers N, N = value seen in logs/runs/*/ready.json), a CHANGED rt/lowcmd writer count blocks too.
oem_lowcmd_confirmed 0
oem_lowcmd_expected_writers -1

# Defaults of ./start.sh (command line options override). P4 (Sim2Sim finding, results/p4): the old authority 0.3 blend q_cmd = q_hold + 0.3*(q_target - q_hold) is the
# UNSTABLE regime (pure hold falls in 1.0-1.7 s, 0.3 in 1.2-2.0 s: it reproduces both real falls); the Policy balances only with (ramped) full authority.
#   stage hold  : ref_mode paused  = the first SSB frame frozen, run_s 3 s   (first-frame / hold test)
#   stage clip  : ref_mode running = the first run_s seconds of the dance, then the reference freezes for end_hold_s and the hand-back follows
#   stage dance : ref_mode running, run_s 7.1 (the whole SSB, 354 frames) + end_hold_s
iface auto
run_s 3.0
authority 1.0
ramp_s 0.3            # authority 0 -> authority over this many seconds (smoothstep) so the first command is not a step
end_hold_s 0.5        # running mode: the reference stays frozen this long after the window before the hand-back
ref_mode paused
#allow_partial_authority 1   # DANGEROUS: lets a sustained authority in (0.05, 0.9) run (the unstable regime) - experiments only

# Voice announcements (G1 audio service, as in wbc_nx/remote_start): 1 = on, 0 = log only. Phrases: 服务已启动 / 正在加载 / 准备就绪 / 开始执行 / 检查失败 / 执行完成 / 已退出 / 异常已交还 / 恢复失败 / 紧急被动
tts 1
tts_volume 100

# ---- Run caps (P4: raised after the offline validation in results/p4). NEVER above the compile-time limits (run_s <= 60 s, authority <= 1.0). The shipped DEFAULT stays 12 s; a package for a dance longer than that writes its own max_run_s here (see ADMISSION.json).
# A run above the old 1.0 s / 0.3 is still flagged "EXCEEDS THE LEGACY CAPS" in the runner log, ready.json, admission list and run_report.json (information only).
max_run_s 12
max_authority 1.0

# ---- Exit policy (src/exit_policy.cpp, EXIT_POLICY.md). Values shown = defaults; uncomment to override. Range checks are enforced (out of range = runner REFUSES).
# Instability (-> WALKRUN requested IMMEDIATELY): tilt > unstable_tilt_rad, OR tilt > unstable_soft_tilt_rad AND (|gyro_xy| > unstable_gyro_rad_s OR d(tilt)/dt > unstable_tilt_rate_rad_s).
# Fallen (-> PASSIVE): tilt > fallen_tilt_rad. unstable_debounce_samples = consecutive distinct lowstate samples that must agree.
#unstable_tilt_rad 0.40
#unstable_soft_tilt_rad 0.30
#unstable_gyro_rad_s 8.0
#unstable_tilt_rate_rad_s 3.0
#unstable_debounce_samples 2
# ---- V1.6 A1 reference-aware instability (EXIT_POLICY.md section 3b). The DIY dance itself leans the pelvis up to 0.50 rad, so a FIXED tilt limit fires on the dance, not on a fall.
# While the dance reference is RUNNING (valid, fresh) the fixed unstable_tilt_rad is replaced by: gravity-direction error vs the REFERENCE pelvis (yaw-free, rad) > ref_dev_rad
#   AND measured tilt > ref_dev_min_tilt_rad AND d(error)/dt >= ref_dev_growth_rad_s (error not shrinking).  No valid reference (lead-in / paused / end hold / missing / NaN / older than
#   ref_max_age_s) -> the old fixed unstable_tilt_rad. unstable_hard_tilt_rad is an ABSOLUTE cap that never depends on the reference (nor on its validity); the soft tilt+gyro/rate rule above stays.
#ref_aware_unstable 1            # 0 = legacy behaviour (fixed unstable_tilt_rad only)            default 1
#unstable_hard_tilt_rad 0.70     # [0.55, fallen_tilt_rad) and > unstable_tilt_rad; reference max lean is 0.50 default 0.70
#ref_dev_rad 0.35                # [0.15, 1.0]                                                    default 0.35
#ref_dev_min_tilt_rad 0.25       # [0.10, unstable_hard_tilt_rad]                                 default 0.25
#ref_dev_growth_rad_s 0.0        # [-2, 10]  (-2 = off)                                           default 0.0
#ref_max_age_s 0.15              # [0.04, 1.0]                                                    default 0.15
#fallen_tilt_rad 1.0
#attitude_max_age_s 0.10
#l2b_hold_s 0.10                 # remote L2+B (factory damping chord) held this long during the run = emergency PASSIVE
#exit_confirm_timeout_s 3.0      # requested FSM must appear within this time after the RPC
#exit_dwell_s 0.3
#exit_stable_window_s 0.8        # FSM must stay in the requested set this long after the first match (catches OEM dropping into fsm 1 later)
#exit_mismatch_fail_s 0.3
#exit_unconfirmed_hold_s 30
#exit_hold_gain_scale 1.0        # HOLD frames during the exit RPC: kp/kd = policy gains * this (<= 1)
#exit_owner_timeout_s 10         # guardian leaves a runner-owned exit alone for this long

# ---- Software safety gates (SAFETY_AUDIT.md). Values shown = defaults after the audit. Hardware limits themselves can only be tightened (range checks).
#state_stale_s 0.060
#state_frozen_ticks 5
#limit_fault_tol_rad 0.05
#speed_fault_frac 0.90
#unknown_speed_limit 20
#torque_meas_fault_frac 1.2
#torque_meas_fault_ticks 10
#max_tilt_rad 1.0
#max_gyro_rad_s 15
#pos_margin_rad 0.005            # was 0.02: target position kept this far inside the joint limits
#target_speed_frac 1.0           # was 0.6: target slew limit = frac * hardware speed limit
#torque_cmd_frac 1.0             # was 0.85: PD torque limit = frac * hardware effort limit
#diverge_rad 1.5
#diverge_ticks 8
#loop_overrun_factor 3.0
#watchdog_s 0.10
#max_entry_tilt_rad 0.5
#quiescent_dq 0.5
#min_state_hz 30

# ---- P5.1 run logging (LOGGING.md). Every run writes trace.csv / obs.bin / state_stream.bin / events.jsonl / safety_clips.csv / exit_frames.csv / manifest.json /
#      run_report.json / anomaly_summary.{json,txt} into logs/runs/<time>/. The writer is asynchronous: the control loop only copies a struct into a queue.
log_preroll_s 5.0          # lowstate samples before the take-over that are kept (full DDS rate)
log_post_exit_s 2.0        # lowstate samples after the exit is confirmed (the first seconds of the OEM controller); the result is announced first
log_obs 1                  # obs.bin: the exact ONNX inputs of every tick (bit-exact policy replay). ~6 KB per tick
log_state_stream 1         # state_stream.bin: every rt/lowstate sample (pre-roll + run + post-exit)
log_min_free_mb 100        # admission FAIL when the log directory has less free space (an unrecordable run is not started)

# ---- P5.3
lead_in_s 1.0              # running modes replay the clip robust_d was TRAINED on: 1 s of frozen first frame before the dance (ssb_padded). In memory only: motion.bin / its hash are untouched. 0 = old behaviour (dance starts at once)
settle_stable_s 1.0        # after a recoverable run the service returns to IDLE (no ack.sh) once WalkRun is confirmed, tilt < 0.15 rad and |gyro_xy| < 1.5 rad/s for this long, the lock is free and the guardian is ready
settle_timeout_s 20        # ... else HOLD (ack.sh) with the missing condition in the reason
guard_torque_ff 0          # EXPERIMENTAL, default OFF (also: start.sh --torque-ff): send the TRAINING actuator torque as LowCmd.tau when the target is clipped at a joint limit; see P5_3_ANALYSIS.md

# V1.6.1: there is NO READY timeout: after F1+F3 the service stays READY until L1+A (run) or START x2 (cancel). No key here can grant or require a manual authorisation.
# ---- V1.6 announce_wait: after L1+A the service says 开始执行 and the runner takes over ONLY after that voice has finished + announce_wait_s.
# The G1 audio service has no "playback finished" callback (TtsMaker returns once the request is accepted): finished = TtsMaker returned + estimated speaking time (announce_s_per_char per character + 0.3 s),
# and never later than announce_max_s after the announcement began (hard upper bound: the wait can never hang). During the wait the robot is NOT taken over: START x2 / L2+B / e-stop / SIGTERM / guardian loss /
# lowstate timeout / tilt / FSM change cancel it (nothing is sent). 0 = take over right after the announcement; the voice itself is unchanged.
announce_wait_s 0.5        # [0, 5] s waited after the announcement finished
announce_max_s 4.0         # [1, 10] s: upper bound for "announcement finished" counted from the start of the announcement
announce_s_per_char 0.30   # [0.1, 1.0] s per Chinese character, conservative estimate of the TTS speaking time
