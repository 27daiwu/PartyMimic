# 部署配置 cpp_g1_v3（V1.6 部署；由 cpp_g1_v2 复制而来，v1/v2 保持不变）
# 与 v2 的区别全部在“框架 + 打包器”里（deploy/partymimic_cpp + pmpipe/package.py），本文件把它们登记为一个新的、可追溯的部署配置：
#   * announce_wait：L1+A 后先播报“开始执行”，**播报完成后再等 announce_wait_s（0.5 s）** 才接管；等待期间不接管，取消/急停/SIGTERM/guardian 异常/lowstate 超时/倾角/FSM 变化都只取消（不下发任何指令），
#                    接管前重新确认前提。site.conf announce_wait_s / announce_max_s / announce_s_per_char（有范围检查）
#   * 现场授权独立配置：config/authz.conf（与模型/动作资产、site.conf 分离）；新包随附**空**文件 = 未授权 = 服务 NOT ARMED（F1+F3 仍只读检查，L1+A 不动作并语音“未授权”）；
#                    由人在现场 `./authorize.sh --phrase I-ACCEPT-UNVALIDATED --confirm-protection` 登记（绑定 policy/motion sha256、模式、最大窗口、主机、有效期、构建）。start.sh 无任何交互输入
#   * 日志：pre-roll 环淘汰（设计内）与真实丢弃分开计数（state_ring_evicted / dropped_states）；logtool LOG_DROPPED 只判真实丢弃；lowstate 缺失按 1 kHz/ms tick 口径；新增 trace 列 dance_frame/dance_t/seg
#   * 参考感知的跟踪/倾角摘要：前导/舞蹈/末帧保持三段统计；TILT 判定报告 实测倾角/参考倾角/偏差，阈值取自运行时判据（A1：unstable_hard_tilt_rad / ref_dev_rad / ref_dev_min_tilt_rad，site.conf）
name: cpp_g1_v3
description: "V1.6：播报完成后等 0.5 s 再接管 + 独立现场授权(authz.conf，默认空=不放行) + 日志丢弃口径修复 + 参考感知的日志摘要/运行时失稳判定 + 解压即可执行"
framework: deploy/partymimic_cpp
package_prefix: partymimic_cpp
site_overrides: {}
modes:
  hold_s: 3.0
  exit_s: 8.0
  clip2_s: 2.0
  clip4_s: 4.0
admission:
  require_sim2sim_pass: true
  require_onnx_parity: true
  require_eval_gate: true
  require_cpp_selfcheck: true
onnx_parity_max_abs: 1.0e-3
dev_build_check: true
zip:
  script_mode: 0o755        # 所有带 #! 的文件 / *.sh / *.so（含 authorize.sh）
  data_mode: 0o644
  verify_extractors: [unzip, bsdtar, python]
timeline:
  lead_in_s: 1.0            # = 框架 site.conf lead_in_s（打包器按框架文件核对）
  end_hold_s: 0.5
  min_failsafe_margin_s: 0.5
# V1.6 打包规则（不能被命令行关闭）：包内必须有 authorize.sh 与**空的** config/authz.conf（不得预先登记任何模型）；site.conf 的 announce_wait_s 必须在 [0,5] 内；start.sh 不得含 read 提问
v16:
  announce_wait_s: 0.5
  authz:
    ship_empty_register: true
    script: authorize.sh
    file: config/authz.conf
  start_sh_no_prompt: true
