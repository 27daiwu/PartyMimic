mode_machine:
  value_used_by_deployment: 5
  meaning: Machine / DoF-configuration identifier carried in the HG LowState_/LowCmd_ (uint8). The official demo (g1_mimic_demo/deploy_template/main.cpp:43) writes 5 with the comment '29dof'; check_mode_machine()
    (g1_pub.h:52-60) accepts 0 (simulation) or a value equal to the one in LowState. Source IDL / examples give NO table of other values, so only 0 = simulation and 5 = G1 29-DoF are documented.
  does_not_change_joint_limits: No official source found that makes effort / velocity / position limits depend on mode_machine; the limits below are per-URDF (Rev 1.0, 29 DoF).
  related_but_different:
    mode_pr: 'LowCmd_.mode_pr: 0 = PR ''series control for pitch/roll joints'', 1 = AB ''parallel control for A/B joints'' (py_g1_low_level_example.py:72-75). It decides how the ANKLE command (and the waist
      pitch/roll pair) is interpreted: joint space (pitch/roll) vs. motor space (A/B). The deployment and sim2real real_bridge use mode_pr=0 (PR), so all limits here are joint-space limits.'
    sim2real_mode_13_15: '''g1-mode_13_15.xml'' / `G1_MODE_15_JOINT_ARMATURE` in sim2real g1.py are simulation-model names (reflected armature of the parallel ankle/waist = 2 x 5020 motors); undocumented,
      NOT shown to be related to LowCmd_.mode_machine.'
  other_variants_not_covered: G1 23-DoF (waist locked, wrists 'INVALID') and G1+ are different machines; the audit rejects them as targets (OFFICIAL_FRAMEWORK_AUDIT F13).
